name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create addon ZIP
        run: |
          mkdir -p dist
          zip -r "dist/swtor_io_tools-${{ github.event.release.tag_name }}.zip" swtor_io_tools

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/swtor_io_tools-${{ github.event.release.tag_name }}.zip
